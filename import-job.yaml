apiVersion: batch/v1
kind: Job
metadata:
  name: import-players
spec:
  template:
    spec:
      serviceAccountName: balance-api
      containers:
      - name: import
        image: postgres:15
        command:
        - sh
        - -c
        - |
          sleep 5  # Wait for Cloud SQL Proxy to start
          PGPASSWORD='cemW${XmyBfqhhXr7#-]<*<P$[$iY99z' psql -h 127.0.0.1 -p 5432 -U volleyball_app -d volleyball -f /sql/import_players.sql
        volumeMounts:
        - name: sql-script
          mountPath: /sql
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
        args:
        - "--private-ip"
        - "atikot-org-share-project:europe-west1:volleyball-db"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: sql-script
        configMap:
          name: player-import-sql
      restartPolicy: Never
  backoffLimit: 2
